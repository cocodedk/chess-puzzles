name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require all four signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing signing secret(s):$missing — set all four (see README → Releases)."; exit 1
          fi

      - name: Read the version
        id: version
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. Refuse to re-release a version, so a
          # forgotten bump fails here instead of overwriting nothing and confusing later.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cannot parse VERSION_NAME: '$VERSION'" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test + 100% coverage gate
        run: ./gradlew test koverVerify --no-daemon

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage the signed APK under a stable filename
        run: |
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "Release APK came out unsigned — signing config did not apply"; exit 1
          fi
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$src" ] || { echo "No release APK produced"; exit 1; }
          cp "$src" ChessPuzzles.apk

      - name: Build signed release bundle (AAB)
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Stage the bundle once it proves to carry the APK's signature
        run: |
          # Google Play takes a bundle, not an APK. It is kept as a workflow artifact below, never
          # as a release asset: the release holds ChessPuzzles.apk alone, which Obtainium and
          # F-Droid read. Everything here fails before the release exists, so a bad bundle leaves
          # no tag behind and the run can simply be repeated.
          src=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          [ -n "$src" ] || { echo "No release bundle produced"; exit 1; }
          # jarsigner and keytool both exit 0 for an unsigned bundle and only say so, so read
          # what they print instead of trusting the exit code.
          verdict=$(jarsigner -verify "$src" 2>&1) || { echo "$verdict"; exit 1; }
          grep -q '^jar verified\.' <<<"$verdict" || { echo "$verdict"; echo "Release bundle is unsigned — signing config did not apply"; exit 1; }
          cert=$(keytool -printcert -jarfile "$src")
          aab_sha=$(sed -n '/SHA256:/{s/.*SHA256: *//p;q}' <<<"$cert")
          # The APK carries v2/v3 signatures only (minSdk 24), which jarsigner cannot read.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "apksigner not found under ANDROID_HOME"; exit 1; }
          apk_certs=$("$apksigner" verify --print-certs ChessPuzzles.apk)
          # keytool prints upper-case hex with colons, apksigner lower-case without.
          aab_sha=$(tr -d ': ' <<<"$aab_sha" | tr 'A-F' 'a-f')
          # apksigner labels its signer lines differently from one build-tools version to the next
          # (the first 0.5.25 run found no "Signer #1" line), so look for the digest itself.
          [[ "$aab_sha" =~ ^[0-9a-f]{64}$ ]] && grep -qF "SHA-256 digest: $aab_sha" <<<"$apk_certs" || {
            echo "Bundle signer '$aab_sha' is not among the APK's signers:"; echo "$apk_certs"; exit 1
          }
          cp "$src" ChessPuzzles.aab

      - name: Keep the signed bundle for Google Play (a workflow artifact, not a release asset)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChessPuzzles-aab
          path: ChessPuzzles.aab
          if-no-files-found: error

      - name: Create GitHub Release (creates the tag at this commit)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ChessPuzzles.apk
