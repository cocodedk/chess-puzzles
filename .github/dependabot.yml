version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch the safe (non-held) minor/patch library updates into one PR.
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The newest AndroidX lines need more than this project pins (compileSdk 36, AGP 8):
      # core 1.19 and Compose UI 1.12 declare minCompileSdk 37 and AGP 9.1 in their AAR
      # metadata, so those bumps fail the build. Hold the namespace's minor/major updates;
      # patches still flow. Remove this once compileSdk 37 and AGP 9 land together.
      - dependency-name: "androidx.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # AGP 8.9 is not tested with Gradle 9, and this build warns that AGP 8 uses Gradle features
      # Gradle 9 drops. Hold the major until AGP 9.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # AGP 9 needs Gradle 9.6 and its built-in Kotlin, a move of its own (PR #99 failed on it).
      # Minor and patch updates of AGP 8 still flow.
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
